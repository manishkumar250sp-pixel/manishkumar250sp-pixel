<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="ITACHI UCHIHA card: The Silent Strategist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11162A"/><stop offset="1" stop-color="#080B16"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4655"/><stop offset="1" stop-color="#00D9FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="394" height="294" rx="20" fill="url(#bg)" stroke="url(#bd)" stroke-width="3"/>
  <circle cx="200" cy="105" r="70" fill="#FF4655" opacity=".12"><animate attributeName="opacity" values=".08;.22;.08" dur="3s" repeatCount="indefinite"/></circle>
  <g transform="translate(200 105)" filter="url(#glow)"><circle r="46" fill="none" stroke="#FF4655" stroke-width="3"/><circle r="8" fill="#FF4655"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><g transform="rotate(0)"><circle cx="0" cy="-26" r="9" fill="#FF4655"/><path d="M0 -35 q14 4 14 18" fill="none" stroke="#FF4655" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120)"><circle cx="0" cy="-26" r="9" fill="#FF4655"/><path d="M0 -35 q14 4 14 18" fill="none" stroke="#FF4655" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(240)"><circle cx="0" cy="-26" r="9" fill="#FF4655"/><path d="M0 -35 q14 4 14 18" fill="none" stroke="#FF4655" stroke-width="5" stroke-linecap="round"/></g></g></g>
  <text x="200" y="205" text-anchor="middle" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#F5F7FF">ITACHI UCHIHA</text>
