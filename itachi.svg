  <text x="200" y="256" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Calm systems. Careful design.</text>
  <text x="200" y="274" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Quiet, precise execution.</text>
