<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="OBITO UCHIHA card: The Comeback Arc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11162A"/><stop offset="1" stop-color="#080B16"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B2FF7"/><stop offset="1" stop-color="#00D9FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="394" height="294" rx="20" fill="url(#bg)" stroke="url(#bd)" stroke-width="3"/>
  <circle cx="200" cy="105" r="70" fill="#7B2FF7" opacity=".12"><animate attributeName="opacity" values=".08;.22;.08" dur="3s" repeatCount="indefinite"/></circle>
  <g transform="translate(200 105)" filter="url(#glow)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/><circle r="46" fill="none" stroke="#7B2FF7" stroke-width="3" stroke-dasharray="14 8"/><circle r="30" fill="none" stroke="#00D9FF" stroke-width="3" stroke-dasharray="8 8"/><circle r="14" fill="none" stroke="#7B2FF7" stroke-width="3"/></g></g>
  <text x="200" y="205" text-anchor="middle" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#F5F7FF">OBITO UCHIHA</text>
  <text x="200" y="228" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" letter-spacing="2" fill="#7B2FF7">THE COMEBACK ARC</text>
  <text x="200" y="256" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Every failed build is a plot twist.</text>
  <text x="200" y="274" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Rewrite it. Ship it.</text>
</svg>