<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Manish Kumar - animated neon header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B16"/><stop offset="1" stop-color="#11162A"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"><animate attributeName="stop-color" values="#7B2FF7;#00D9FF;#7B2FF7" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00D9FF"><animate attributeName="stop-color" values="#00D9FF;#7B2FF7;#00D9FF" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7B2FF7" stroke-opacity=".18" stroke-width="1"/></pattern>
    <clipPath id="c"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <circle cx="150" cy="60" r="130" fill="#7B2FF7" opacity=".25"><animate attributeName="cx" values="150;300;150" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="210" r="140" fill="#00D9FF" opacity=".18"><animate attributeName="cx" values="860;700;860" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="40" r="60" fill="#FF4655" opacity=".14"/>
    <rect x="0" y="0" width="1000" height="3" fill="#00D9FF" opacity=".5"><animate attributeName="y" values="0;260;0" dur="7s" repeatCount="indefinite"/></rect>
    <text x="500" y="125" text-anchor="middle" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="url(#neon)" filter="url(#glow)">MANISH KUMAR</text>
    <text x="500" y="170" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" letter-spacing="6" fill="#AAB3CC">ELECTRONICS  ×  VLSI  ×  ROBOTICS  ×  CODE</text>
    <rect x="300" y="195" width="400" height="3" rx="2" fill="url(#neon)"/>
  </g>
  <rect x="1.5" y="1.5" width="997" height="257" rx="17" fill="none" stroke="url(#neon)" stroke-width="3"/>
</svg>
