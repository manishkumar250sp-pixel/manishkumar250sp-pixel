<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="GOKU card: The Limitless Learner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11162A"/><stop offset="1" stop-color="#080B16"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="394" height="294" rx="20" fill="url(#bg)" stroke="url(#bd)" stroke-width="3"/>
  <circle cx="200" cy="105" r="70" fill="#00D9FF" opacity=".12"><animate attributeName="opacity" values=".08;.22;.08" dur="3s" repeatCount="indefinite"/></circle>
  <g transform="translate(200 105)" filter="url(#glow)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(0)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(30)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(60)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(90)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(120)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(150)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(180)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(210)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(240)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(270)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(300)"/><line x1="0" y1="-20" x2="0" y2="-52" stroke="#00D9FF" stroke-width="4" stroke-linecap="round" transform="rotate(330)"/></g><circle r="14" fill="#00D9FF"><animate attributeName="r" values="12;17;12" dur="2s" repeatCount="indefinite"/></circle></g>
  <text x="200" y="205" text-anchor="middle" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#F5F7FF">GOKU</text>
  <text x="200" y="228" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" letter-spacing="2" fill="#00D9FF">THE LIMITLESS LEARNER</text>
  <text x="200" y="256" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Train daily. Ship daily.</text>
  <text x="200" y="274" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#AAB3CC">Push past your limit.</text>
</svg>